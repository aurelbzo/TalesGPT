# Local cluster whose NodePort 30080 is reachable at http://localhost:30080
# (kube-proxy then load-balances across ALL pods; `kubectl port-forward` would pin one pod).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
